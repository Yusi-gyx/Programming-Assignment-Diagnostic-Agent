[package]
name = "pada"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lib]
name = "pada"
path = "src/lib.rs"
